name: Telnyx E2E and GitHub Pages Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telnyx-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.result.outputs.tests_passed }}
      report_ready: ${{ steps.result.outputs.report_ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop scenarios
        id: desktop
        continue-on-error: true
        run: npm run test:desktop

      - name: Run mobile scenarios
        id: mobile
        continue-on-error: true
        run: npm run test:mobile

      - name: Build HTML report
        if: always()
        run: npm run report

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/reports/html

      - name: Record test result
        id: result
        if: always()
        run: |
          if [ "${{ steps.desktop.outcome }}" = "success" ] && [ "${{ steps.mobile.outcome }}" = "success" ]; then
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f cypress/reports/html/index.html ]; then
            echo "report_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-report:
    needs: test
    if: always() && needs.test.outputs.report_ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy test report
        id: deployment
        uses: actions/deploy-pages@v4

  report-test-status:
    needs: [test, deploy-report]
    if: always() && needs.test.outputs.tests_passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark workflow failed when E2E tests fail
        run: exit 1